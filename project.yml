name: HermesDesk
options:
  minimumXcodeGenVersion: 2.45.0
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  AppCore:
    path: Packages/AppCore
  HermesKit:
    path: Packages/HermesKit

targets:
  HermesDeskApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: apps/mac/HermesDeskApp
    info:
      path: apps/mac/HermesDeskApp/SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: Hermes Desk
        CFBundleIdentifier: io.nous.hermesdesk
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 Nous Research
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nous.hermesdesk
        PRODUCT_NAME: Hermes Desk
        PRODUCT_MODULE_NAME: HermesDesk
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - package: AppCore
        product: AppCore
      - package: HermesKit
        product: HermesKit
  HermesDeskAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: apps/mac/HermesDeskAppTests
    dependencies:
      - target: HermesDeskApp
      - package: AppCore
        product: AppCore
      - package: HermesKit
        product: HermesKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hermes Desk.app/Contents/MacOS/Hermes Desk"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  HermesDeskApp:
    build:
      targets:
        HermesDeskApp: all
    test:
      targets:
        - name: HermesDeskAppTests
